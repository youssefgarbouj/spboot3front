<form>
  <div [hidden]="ajout">
    <label>ID Catégorie</label>
    <input type="text" [(ngModel)]="categorie.idEngine" name="idEngine" class="form-control w-25">
  </div>
  <div>
    <label>Nom Catégorie</label>
    <input type="text" [(ngModel)]="categorie.nomEngine" name="nomEngine" class="form-control"
      placeholder="Entrez un nom de catégorie...">
  </div>
  <div class="mt-2">
    <button type="button" [disabled]="!categorie.nomEngine" class="btn btn-success"
      (click)="saveCategorie()">{{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>
  </div>
</form>
